plugins {
    id "com.android.application"
}

def releaseStorePassword = System.getenv("NEAR_TRANSFER_RELEASE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("NEAR_TRANSFER_RELEASE_KEY_PASSWORD")
def releaseKeyAlias = "near-transfer-release-v1"
def releaseKeystore = rootProject.file("keystore/near-transfer-release.jks")
def releaseSigningReady = releaseKeystore.isFile() &&
        releaseStorePassword != null && releaseKeyPassword != null

android {
    namespace "com.nearbyshare.legacy"
    compileSdk 35

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.nearbyshare.legacy"
        minSdk 9
        targetSdk 28
        versionCode 19
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        unsigned {
            initWith debug
            signingConfig null
        }
    }
}